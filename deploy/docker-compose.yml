services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      APP_ORIGIN: https://${DOMAIN:?set DOMAIN}
      COOKIE_SECURE: "true"
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-CVRDE Demo <no-reply@example.invalid>}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD}
      DEMO_EMAIL_PM: ${DEMO_EMAIL_PM:-}
      DEMO_EMAIL_S1: ${DEMO_EMAIL_S1:-}
      DEMO_EMAIL_S2: ${DEMO_EMAIL_S2:-}
      DEMO_EMAIL_REVIEWER: ${DEMO_EMAIL_REVIEWER:-}
    volumes:
      - uploads:/data/uploads
volumes:
  uploads:
  caddy_data:
  caddy_config:
