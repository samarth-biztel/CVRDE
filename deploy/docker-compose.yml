services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cvrde
      POSTGRES_USER: cvrde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvrde -d cvrde"]
      interval: 5s
      timeout: 5s
      retries: 12
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cvrde:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/cvrde
      APP_ORIGIN: https://${DOMAIN:?set DOMAIN}
      COOKIE_SECURE: "true"
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-CVRDE Demo <no-reply@example.invalid>}
      DEMO_EMAIL_PM: ${DEMO_EMAIL_PM:-}
      DEMO_EMAIL_S1: ${DEMO_EMAIL_S1:-}
      DEMO_EMAIL_S2: ${DEMO_EMAIL_S2:-}
      DEMO_EMAIL_REVIEWER: ${DEMO_EMAIL_REVIEWER:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
